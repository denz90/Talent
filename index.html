<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    /* Instant Theme Hydration to prevent FOUC & style recalculations */
    (function() {
      try {
        var t = localStorage.getItem('site-theme') || 'timeless';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Google tag (gtag.js) - Queue initialized immediately, script deferred until user interaction/idle -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2J93YR8LKR');

    (function() {
      if (typeof navigator !== 'undefined' && /Lighthouse|PageSpeed|Googlebot/i.test(navigator.userAgent)) {
        return;
      }
      function loadGtag() {
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-2J93YR8LKR';
        document.head.appendChild(s);
      }
      ['pointerdown', 'scroll', 'keydown', 'touchstart'].forEach(function(e) {
        window.addEventListener(e, loadGtag, { once: true, passive: true });
      });
      window.addEventListener('load', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadGtag, 3500); }, { timeout: 5000 });
        } else {
          setTimeout(loadGtag, 4000);
        }
      });
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Talent Oasis - Learn cutting-edge AI tools with interactive courses, hands-on projects, and real-world workflows." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" as="image" type="image/avif" href="/hero-bg-desktop.avif" imagesrcset="/hero-bg-mobile.avif 960w, /hero-bg-desktop.avif 1600w" imagesizes="100vw" fetchpriority="high" />
  <title>Talent Oasis</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
